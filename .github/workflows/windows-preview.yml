name: Windows preview

on:
  workflow_dispatch:
  push:
    branches: ['build/windows-preview-029']
    paths:
      - '.github/workflows/windows-preview.yml'
      - 'engine/**'
      - 'resources/**'
      - 'scripts/build-windows.ps1'
      - 'src/**'
      - 'src-tauri/**'
      - 'package*.json'

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-2025
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        id: python
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install dependencies
        run: npm ci --registry=https://registry.npmjs.org --replace-registry-host=always
      - name: Run frontend tests
        run: npm test
      - name: Build and test NSIS installer
        shell: pwsh
        env:
          ZHAI_CI_PYTHON3: ${{ steps.python.outputs.python-path }}
        run: ./scripts/build-windows.ps1 -Python3Path $env:ZHAI_CI_PYTHON3 -TestInstaller
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ZHAI-Windows-x64-preview
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
